# ==============================================================================
# BOT DE TRADING - CONFIGURACION UNIFICADA (v4.0)
# ==============================================================================

# ------------------------------------------------------------------------------
# ENVIRONMENT_SELECTED
# ------------------------------------------------------------------------------
# Elige que archivo .env cargar: desa.env (testnet) o prod.env (real).
# VALOR ACTUAL: desa.env
ENVIRONMENT_SELECTED = prod.env
# Ajusta MIN_TRADE_USDT segun tu tolerancia al riesgo.
# ==============================================================================
# ==============================================================================
# Este archivo define TODOS los parametros del bot. Cada valor tiene un
# comentario explicando que controla, como usarlo y que pasa si lo cambias.
#
# REGLA DE ORO: si no entendes que hace un parametro, NO LO TOQUES.
# Los valores por defecto ya estan calibrados para BTC/USDT y ETH/USDT en 1h.
# ==============================================================================
# SYMBOL_LIST
# ------------------------------------------------------------------------------
# Pares que el bot va a monitorear y operar. Separados por coma, sin espacios.
# El bot evalua TODOS los simbolos en cada ciclo de 60s, pero solo compra el
# que tenga mejor relacion TP/SL (modo single-trade: UNA posicion a la vez).
# Ejemplos:
#   BTC/USDT,ETH/USDT             -> opera Bitcoin y Ethereum (default)
#   BTC/USDT                      -> solo Bitcoin
#   BTC/USDT,ETH/USDT,SOL/USDT    -> anadir mas tokens (probar antes en testnet)
# VALOR ACTUAL: BTC/USDT,ETH/USDT
SYMBOL_LIST = BTC/USDT,ETH/USDT

# ------------------------------------------------------------------------------
# MIN_TRADE_USDT
# ------------------------------------------------------------------------------
# Piso ABSOLUTO de cada orden. Ningun modo compra por debajo de esto.
# Binance exige MinNotional (~$5 ETH/USDT, ~$10 BTC/USDT), detectado auto.
# VALOR ACTUAL: 5.0
MIN_TRADE_USDT = 5.0

# ------------------------------------------------------------------------------
# MAX_TRADE_USDT
# ------------------------------------------------------------------------------
# Techo ABSOLUTO de cualquier orden. CORTOCIRCUITO DE SEGURIDAD.
# VALOR ACTUAL: 100.0 / RECOMENDADO: 50-200 cuentas chicas
MAX_TRADE_USDT = 100.0

# ==============================================================================
# ESTRATEGIA ADAPTATIVA
# ==============================================================================
# SL se calcula DINAMICAMENTE desde la volatilidad (ultimas N velas):
#   Alta vol -> SL amplio, trailing amplio
#   Baja vol -> SL ajustado, trailing ajustado
# TP es PROGRESIVO: 2^N * fee_rate donde N = wins consecutivas por moneda.
# ==============================================================================

# ------------------------------------------------------------------------------
# RSI_PERIODO
# ------------------------------------------------------------------------------
# Velas 1h para RSI. 14=estandar. 7=rapido. 21=lento.
# VALOR ACTUAL: 14
RSI_PERIODO = 14

# ------------------------------------------------------------------------------
# VOLATILIDAD_VENTANA_HORAS
# ------------------------------------------------------------------------------
# Ventana en velas 1h para volatilidad (desvio estandar retornos log).
# 168=7d. Alimenta SL, trailing, cooldown.
# VALOR ACTUAL: 168
VOLATILIDAD_VENTANA_HORAS = 168

# ------------------------------------------------------------------------------
# VOLATILIDAD_MULT_SL
# ------------------------------------------------------------------------------
# SL = vol_diaria * MULT_SL. 0.3=SL 1.2% con vol 4% (relacion 0.3:1).
# VALOR ACTUAL: 0.3 (Opción 3: SL ajustado)
VOLATILIDAD_MULT_SL = 0.3

# ------------------------------------------------------------------------------
# SL_DINAMICO_MIN / SL_DINAMICO_MAX
# ------------------------------------------------------------------------------
# Pisos y techo del SL (decimal). SL = clamp(vol*MULT, MIN, MAX).
# VALOR ACTUAL: min=0.5% max=3% (Opción 3: ajustado)
SL_DINAMICO_MIN = 0.005
SL_DINAMICO_MAX = 0.03

# ------------------------------------------------------------------------------
# RSI_ENTRADA_BTC / RSI_ENTRADA_ETH
# ------------------------------------------------------------------------------
# Umbral fijo de RSI para comprar. Se compra cuando RSI < este valor.
# Diferente por moneda para ajustarse a su perfil de volatilidad.
# VALOR ACTUAL: BTC=30, ETH=40
RSI_ENTRADA_BTC = 30
RSI_ENTRADA_ETH = 40

# ------------------------------------------------------------------------------
# RSI_SOBRECOMPRA_BTC / RSI_SOBRECOMPRA_ETH
# ------------------------------------------------------------------------------
# Vende si RSI supera este umbral (sobrecompra). Resetea consecutive_wins.
# Diferente por moneda. VALOR ACTUAL: BTC=70, ETH=70
RSI_SOBRECOMPRA_BTC = 70
RSI_SOBRECOMPRA_ETH = 70

# ------------------------------------------------------------------------------
# TP_PCT
# ------------------------------------------------------------------------------
# Take-Profit fijo en porcentaje (decimal). Usado como fallback si TP dinámico
# está deshabilitado. TP = precio_compra * (1 + TP_PCT).
# VALOR ACTUAL: 0.0055 (0.55%)
TP_PCT = 0.0055

# ------------------------------------------------------------------------------
# TP DINAMICO (Opción 3)
# ------------------------------------------------------------------------------
# Si TP_DINAMICO_HABILITADO=true, TP = clamp(vol_diaria * TP_VOL_MULT, TP_MIN_PCT, TP_MAX_PCT)
# TP cambia según volatilidad: mercados volátiles = TP más grande.
# VALOR ACTUAL: TP=vol×0.5, min=1%, max=5%
TP_DINAMICO_HABILITADO = true
TP_VOL_MULT = 0.5
TP_MIN_PCT = 0.01
TP_MAX_PCT = 0.05

# ==============================================================================
# TRAILING STOP ADAPTATIVO
# ==============================================================================
# Activacion=vol*0.4  Distancia=vol*0.6. Acotados entre min y max.
# Sube el SL automaticamente cuando el precio avanza.
# ==============================================================================

TRAILING_ACTIVA_MIN = 0.005     # 0.5% piso activacion
TRAILING_ACTIVA_MAX = 0.03      # 3% techo activacion
TRAILING_DISTANCIA_MIN = 0.01   # 1% distancia minima al maximo
TRAILING_DISTANCIA_MAX = 0.05   # 5% distancia maxima al maximo

# ==============================================================================
# COOLDOWN POST-PERDIDA (adaptativo)
# ==============================================================================
# Tras SL espera N horas antes de reingresar. cooldown=SL*50, acotado.
# POST-TP: No hay cooldown, reingresa inmediato.
# ==============================================================================

COOLDOWN_MIN_HORAS = 1.0   # 1h minimo
COOLDOWN_MAX_HORAS = 6.0   # 6h maximo

# ==============================================================================
# FILTROS FIJOS (NO adaptativos)
# ==============================================================================

SMA_DISTANCIA_MAX_PCT = 0.05        # Anticuchillo: 5% bajo SMA200 = no compra
SMA_FILTR0_HABILITADO = true        # Activado en produccion
MIN_INTERVALO_MANIOBRAS_HORAS = 1.0  # Gating: 1h entre compras (ventas sin limite)
DRAWDOWN_DIARIO_MAX_PCT = 0.05       # Circuit breaker: 5% perdida diaria = stop
MAX_DAILY_TRADES = 50                # Max 50 compras/dia total

# ==============================================================================
# COMISIONES Y BNB
# ==============================================================================

BINANCE_FEE_RATE = 0.00075       # 0.075% real (con descuento BNB)
BINANCE_FEE_RATE_TAKER = 0.00075  # 0.075% taker (con descuento BNB)
MIN_NOTIONAL_FALLBACK = 5.0     # Fallback si API no responde (USD)
PROFIT_FLOOR_MULT = 1.0         # Multiplicador de piso de ganancia
BNB_TARGET_PCT = 0.05         # Legacy: 5% portfolio en BNB (si DIAS=0)
BNB_DIAS_COBERTURA = 60       # Dinamico: BNB para 60 dias de fees

# ==============================================================================
# OBSERVABILIDAD Y LOG
# ==============================================================================

LOG_ARCHIVO_HABILITADO = true   # Guarda log a archivo
LOG_ARCHIVO_PATH = logs/bot_trading.log  # Ruta base (se agrega sufijo de fecha automaticamente)
LOG_BUFFER_MAX = 4              # 4 lineas visibles en dashboard

# ------------------------------------------------------------------------------
# GESTION DE LOGS (rotacion por tamano)
# ------------------------------------------------------------------------------
# Si los logs suman mas de LOG_MAX_MB, se borran los anteriores a
# LOG_RETENCION_DIAS dias. La verificacion corre cada LOG_PURGA_INTERVALO_SEG.
LOG_MAX_MB = 100               # 100 MB total antes de purgar
LOG_RETENCION_DIAS = 20        # Conservar ultimos 20 dias
LOG_PURGA_INTERVALO_SEG = 3600 # Verificar cada 1 hora

# ==============================================================================
# ROBUSTEZ DE RED
# ==============================================================================

MAX_REINTENTOS = 3        # 3 reintentos por llamada API
BACKOFF_SEGUNDOS = 5      # 5s entre reintentos
LOOP_SLEEP_SEGUNDOS = 60  # Bucle principal cada 60s
